name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript-e2e:
    name: JavaScript e Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm test
      - run: node --test scripts/deploy/*.test.mjs scripts/cloud/*.test.mjs
      - run: python3 -m unittest discover -s scripts/deploy -p '*_test.py'
      - run: pnpm build:web
      - run: pnpm --filter @nexohub/client install:e2e
      - run: pnpm test:e2e:ci
      - name: Build do website em /hub/
        run: pnpm build:web
        env:
          NEXOHUB_BASE_PATH: /hub/
      - name: E2E do website em /hub/
        run: node apps/client/e2e/executar-subpasta.mjs

  rust-windows:
    name: Rust no Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --project engines/python
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - shell: powershell
        run: ./scripts/verificar-dependencias-windows.ps1

  hybrid-ledger-emulator:
    name: Identidade e reservas em emulador local
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: cloud-firestore-emulator
      - run: rustup toolchain install stable --profile minimal
      - name: Provar cotas concorrentes sem credenciais ou serviços reais
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8189
        shell: bash
        run: |
          gcloud emulators firestore start --host-port="$FIRESTORE_EMULATOR_HOST" --project=demo-nexohub-hybrid --quiet > "$RUNNER_TEMP/firestore.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" || true' EXIT
          for attempt in {1..60}; do
            if curl --silent --fail "http://$FIRESTORE_EMULATOR_HOST/" > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail "http://$FIRESTORE_EMULATOR_HOST/" > /dev/null
          cargo test -p nexohub-server --test cloud_auth --test cloud_firestore --test cloud_ledger --test cloud_admin --test cloud_desktop --test cloud_identity_routes --locked -- --include-ignored

  python:
    name: Python Engine
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --project engines/python
      - run: uv run --locked --project engines/python ruff check engines/python
      - run: uv run --locked --project engines/python pytest
      - run: uv build --project engines/python
