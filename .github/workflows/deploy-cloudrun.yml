name: Deploy Cloud Run (Web)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: southamerica-east1
  SERVICE_NAME: nexohub
  IMAGE_NAME: nexohub-web

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    if: github.repository == 'junior-aguiar-eng/NexoHub'
    timeout-minutes: 30

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Autenticação Google Cloud (Workload Identity ou Service Account Key)
        id: auth
        if: env.PROJECT_ID != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud CLI
        if: env.PROJECT_ID != ''
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Autenticar Docker no Google Artifact Registry / GCR
        if: env.PROJECT_ID != ''
        run: |
          gcloud auth configure-docker --quiet
          gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet || true

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push da Imagem de Produção
        if: env.PROJECT_ID != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            southamerica-east1-docker.pkg.dev/${{ env.PROJECT_ID }}/ratione/nexohub:${{ github.sha }}
            southamerica-east1-docker.pkg.dev/${{ env.PROJECT_ID }}/ratione/nexohub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy no Google Cloud Run
        if: env.PROJECT_ID != ''
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image southamerica-east1-docker.pkg.dev/${{ env.PROJECT_ID }}/ratione/nexohub:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars "HOST=0.0.0.0,STATIC_DIR=/app/dist,RUST_LOG=info"

      - name: Exibir URL do Serviço Cloud Run
        if: env.PROJECT_ID != ''
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --platform managed --region ${{ env.REGION }} --format 'value(status.url)')
          echo "================================================="
          echo "🚀 NexoHub Web implantado com sucesso!"
          echo "URL direta Cloud Run: $SERVICE_URL"
          echo "Domínio configurado: https://nexohub.nexojuris.ia.br"
          echo "================================================="
