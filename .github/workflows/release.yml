name: Artifacts de release

on:
  workflow_dispatch:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-alpha.*", "v[0-9]+.[0-9]+.[0-9]+-beta.*", "v[0-9]+.[0-9]+.[0-9]+-rc.*"]

permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  security-gates:
    uses: ./.github/workflows/security.yml

  windows-installer:
    needs: [gates, security-gates]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: rustup default 1.88.0
      - run: pnpm install --frozen-lockfile
      - name: Verificar versão e manifestos
        shell: powershell
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:NEXOHUB_RELEASE_VERSION = $env:GITHUB_REF_NAME.Substring(1)
          }
          pnpm release:verify
      - name: Obter sidecars com integridade verificada
        shell: powershell
        run: ./scripts/install-languagetool.ps1 -InstallRoot ./apps/desktop/src-tauri/resources/runtime/languagetool
      - run: pnpm build:windows
      - name: Gerar checksums
        shell: powershell
        run: |
          $files = Get-ChildItem target/release/bundle -Recurse -File -Include *.exe,*.msi
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } | Set-Content target/release/bundle/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexohub-community-windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error

  portable-artifacts:
    needs: [gates, security-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.12.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - run: uv build --project engines/python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nexohub-community-portable
          path: |
            apps/client/dist/**
            engines/python/dist/**
          if-no-files-found: error
