name: Artifacts de release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

permissions:
  contents: write
  pull-requests: read

jobs:
  gates:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  security-gates:
    uses: ./.github/workflows/security.yml
    secrets: inherit

  windows-installer:
    name: Instalador Windows (Inno Setup)
    needs: [gates, security-gates]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verificar versão e manifestos
        shell: powershell
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:NEXOHUB_RELEASE_VERSION = $env:GITHUB_REF_NAME.Substring(1)
          }
          pnpm release:verify
      - name: Obter sidecars com integridade verificada
        shell: powershell
        run: ./scripts/install-languagetool.ps1 -InstallRoot ./apps/desktop/src-tauri/resources/runtime/languagetool
      - name: Instalar Inno Setup 6.7.3
        shell: powershell
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') {
            throw 'Checksum inválido do instalador do Inno Setup.'
          }
          $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Instalação do Inno Setup falhou: $($process.ExitCode)" }
      - run: pnpm build:windows
      - name: Gerar checksums
        shell: powershell
        run: |
          $files = Get-ChildItem target/release/installer -File -Filter *.exe
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } | Set-Content target/release/installer/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nexohub-community-windows-x64
          path: |
            target/release/installer/*.exe
            target/release/installer/SHA256SUMS.txt
          if-no-files-found: error

  portable-artifacts:
    name: Artefatos Portáteis (Web e Python Engine)
    needs: [gates, security-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:web
      - run: uv build --project engines/python
      - uses: actions/upload-artifact@v4
        with:
          name: nexohub-community-portable
          path: |
            apps/client/dist/**
            engines/python/dist/**
          if-no-files-found: error

  publish-release:
    name: Publicar GitHub Release
    needs: [windows-installer, portable-artifacts]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Publicar ou Atualizar Release no GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "NexoHub $TAG" --notes-file CHANGELOG.md
          fi
          find release-artifacts -type f -exec gh release upload "$TAG" {} --clobber +

