name: Artifacts de release

on:
  workflow_dispatch:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-alpha.*", "v[0-9]+.[0-9]+.[0-9]+-beta.*", "v[0-9]+.[0-9]+.[0-9]+-rc.*"]

permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  security-gates:
    uses: ./.github/workflows/security.yml

  windows-installer:
    name: Instalador Windows (MSI e NSIS)
    needs: [gates, security-gates]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: pnpm install --frozen-lockfile
      - name: Verificar versão e manifestos
        shell: powershell
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:NEXOHUB_RELEASE_VERSION = $env:GITHUB_REF_NAME.Substring(1)
          }
          pnpm release:verify
      - name: Obter sidecars com integridade verificada
        shell: powershell
        run: ./scripts/install-languagetool.ps1 -InstallRoot ./apps/desktop/src-tauri/resources/runtime/languagetool
      - run: pnpm build:windows
      - name: Gerar checksums
        shell: powershell
        run: |
          $files = Get-ChildItem target/release/bundle -Recurse -File -Include *.exe,*.msi
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } | Set-Content target/release/bundle/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nexohub-community-windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error

  portable-artifacts:
    name: Artefatos Portáteis (Web e Python Engine)
    needs: [gates, security-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - run: uv build --project engines/python
      - uses: actions/upload-artifact@v4
        with:
          name: nexohub-community-portable
          path: |
            apps/client/dist/**
            engines/python/dist/**
          if-no-files-found: error
