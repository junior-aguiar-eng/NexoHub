name: Segurança e licenças

on:
  workflow_call:
  push:
    branches: [main]
    paths: ["**/package.json", "pnpm-lock.yaml", "**/Cargo.toml", "Cargo.lock", "deny.toml", "engines/python/**", "runtime/**", "scripts/audit-licenses.mjs"]
  pull_request:
    paths: ["**/package.json", "pnpm-lock.yaml", "**/Cargo.toml", "Cargo.lock", "deny.toml", "engines/python/**", "runtime/**", "scripts/audit-licenses.mjs"]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies-and-licenses:
    name: Dependências e Licenças
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --project engines/python
      - run: pnpm audit --audit-level=high
      - run: uv audit --locked --project engines/python
      - run: pnpm licenses:check

  cargo-deny:
    name: Cargo Deny (Licenças e Vulnerabilidades)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources

  secret-scan:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Executar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
