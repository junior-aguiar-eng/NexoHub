[package]
name = "nexohub-desktop"
version = "0.1.0-alpha.1"
description = "Shell desktop do NexoHub"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.88"

[lib]
name = "nexohub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
nexohub-core = { path = "../../../crates/nexohub-core" }
