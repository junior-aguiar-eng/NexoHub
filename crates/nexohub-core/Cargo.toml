[package]
name = "nexohub-core"
version = "0.2.4"
description = "Núcleo nativo de aplicação do NexoHub"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
blake3 = "1.8.7"
dunce = "1.0.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
lopdf = { version = "0.44.0", default-features = false }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
ureq = { version = "2.10.1", default-features = false, features = ["tls"] }
uuid = { version = "1.26.0", features = ["v4"] }

aws-lc-rs = { version = "=1.19.0", features = ["prebuilt-nasm"] }
base64 = "0.22.1"
url = "2.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
flate2 = "1.1"
