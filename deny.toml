[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = [
    "RUSTSEC-2024-0429",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # rusqlite 0.41 / libsqlite3-sys 0.39 exige rustc >= 1.89 (workspace fixa MSRV 1.88);
    # apenas DBs/WAL locais sob projeto concedido são abertos.
    "RUSTSEC-2026-0459",
]

[licenses]
confidence-threshold = 0.93
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
