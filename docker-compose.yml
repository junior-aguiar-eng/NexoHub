services:
  redis:
    image: redis:7-alpine
    container_name: nexohub-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  engine-api:
    build:
      context: ./services/engine-api
      dockerfile: Dockerfile
    container_name: nexohub-engine-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TMP_DIR=/tmp/pdf_tasks
      - CORS_ORIGINS=*
    volumes:
      - task_storage:/tmp/pdf_tasks
    depends_on:
      - redis
    restart: unless-stopped

  engine-worker:
    build:
      context: ./services/engine-api
      dockerfile: Dockerfile
    container_name: nexohub-engine-worker
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TMP_DIR=/tmp/pdf_tasks
    volumes:
      - task_storage:/tmp/pdf_tasks
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
  task_storage:
