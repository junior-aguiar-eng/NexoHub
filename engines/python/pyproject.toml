[project]
name = "nexohub-document-engine"
version = "0.1.0a1"
description = "Document engine boundary for NexoHub"
readme = "README.md"
requires-python = ">=3.14"
license = "MPL-2.0"
dependencies = [
    "ctranslate2==4.8.1",
    "onnxruntime==1.29.0",
    "pillow==12.3.0",
    "pypdfium2==5.13.0",
    "python-docx-ng==2.1.0",
    "rapidocr==3.9.2",
    "sentencepiece==0.2.1",
]

[dependency-groups]
dev = ["pytest>=8.4.0", "ruff>=0.12.0"]

[build-system]
requires = ["uv_build>=0.8.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = ["services", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
