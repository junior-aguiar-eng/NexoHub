[project]
name = "nexohub-document-engine"
version = "0.0.0"
description = "Document engine boundary for NexoHub"
readme = "README.md"
requires-python = ">=3.14"
license = "MPL-2.0"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.4.0", "ruff>=0.12.0"]

[build-system]
requires = ["uv_build>=0.8.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
